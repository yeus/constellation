name: Checks and Deploy Website

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Check formatting
        run: corepack yarn format:check

      - name: Build vendor packages
        run: corepack yarn build:vendor

      - name: Lint and typecheck
        run: corepack yarn lint

      - name: Test
        run: corepack yarn test

      - name: Check Android configuration
        run: corepack yarn test:android:config

      - name: Build web app
        run: corepack yarn build

  browser-regression:
    name: Browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build vendor packages
        run: corepack yarn build:vendor

      - name: Share-flow regression
        run: corepack yarn playwright test tests/share-flow.spec.ts --workers=1

      - name: P2P regression
        run: corepack yarn playwright test tests/p2p-share.spec.ts --project=desktop --workers=1

      - name: Map UI regression
        run: corepack yarn playwright test tests/map-ui.spec.ts --workers=1

      - name: Sharing diagnostics regression
        run: corepack yarn playwright test tests/sharing-diagnostics.spec.ts --workers=1

      - name: GitHub Pages preflight
        run: corepack yarn test:pages

  screenshots:
    name: Capture browser screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Capture screenshots
        run: corepack yarn screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-previews
          path: .screenshots/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  pages-build:
    name: Build GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - browser-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build Pages artifact
        env:
          ANDROID_APP_LINK_SHA256: ${{ secrets.ANDROID_APP_LINK_SHA256 }}
        run: corepack yarn build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pages-deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
