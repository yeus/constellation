name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: 'true'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tag and application versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(jq -er '.version' package.json)"
          tauri_version="$(jq -er '.version' src-tauri/tauri.conf.json)"
          if [[ "$package_version" != "$tauri_version" ]]; then
            echo "package.json version $package_version does not match Tauri version $tauri_version." >&2
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            "v$package_version"|"v$package_version"-*) ;;
            *)
              echo "Tag $GITHUB_REF_NAME must match v$package_version or use that version with a prerelease suffix." >&2
              exit 1
              ;;
          esac
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  appimage:
    name: Build AppImage
    needs: validate-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build AppImage
        run: nix run .#build-desktop-release-appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: release-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Build Flatpak
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            flatpak \
            flatpak-builder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Validate Flatpak inputs
        run: corepack yarn lint:flatpak

      - name: Build Flatpak
        run: corepack yarn build:desktop:release:flatpak

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: dist/*.flatpak
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build signed Android APK
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export NDK_HOME="$ANDROID_NDK_HOME"
          corepack yarn build:android:release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            dist/constellation-android-release-arm64-v8a.apk
            dist/constellation-android-release-arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - validate-tag
      - appimage
      - flatpak
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create release checksums
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          flatpak="$(find release-assets -maxdepth 1 -type f -name '*.flatpak' -print -quit)"
          apk="$(find release-assets -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$appimage"
          test -s "$flatpak"
          test -s "$apk"
          (
            cd release-assets
            sha256sum \
              "$(basename "$appimage")" \
              "$(basename "$flatpak")" \
              "$(basename "$apk")" \
              > SHA256SUMS
          )

      - name: Publish release and upload assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish-github-release.sh release-assets "$GITHUB_REF_NAME"
