id: space.taskyon.constellation
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: constellation

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  # The app needs network access at runtime for P2P sharing and the map archive.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Linux protected state uses the host Secret Service directly.
  - --talk-name=org.freedesktop.secrets

modules:
  - name: constellation
    buildsystem: simple
    build-options:
      # The build itself is offline: dependencies come from generated-sources.json
      # and cargo-sources.json, and Yarn is pinned as a source file.
      env:
        HOME: /run/build/constellation
        npm_config_cache: /run/build/constellation/npm-cache
        XDG_CACHE_HOME: /run/build/constellation/flatpak-node/cache
        YARN_ENABLE_NETWORK: '0'
        YARN_ENABLE_GLOBAL_CACHE: '0'
        YARN_GLOBAL_FOLDER: /run/build/constellation/flatpak-node/yarn-berry
        CARGO_HOME: /run/build/constellation/cargo
        CARGO_NET_OFFLINE: 'true'
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
    build-commands:
      - node yarn-4.16.0.cjs plugin import ./flatpak-node/flatpak-yarn.js
      - node yarn-4.16.0.cjs install --immutable
      - node yarn-4.16.0.cjs tauri build --no-bundle
      - install -Dm755 src-tauri/target/release/constellation /app/bin/constellation
      - install -Dm644 packaging/flatpak/space.taskyon.constellation.desktop /app/share/applications/space.taskyon.constellation.desktop
      - install -Dm644 packaging/flatpak/space.taskyon.constellation.metainfo.xml /app/share/metainfo/space.taskyon.constellation.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/space.taskyon.constellation.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/space.taskyon.constellation.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/space.taskyon.constellation.png
    sources:
      # BEGIN local-source
      # Local builds use the working tree. Flathub submissions must replace this
      # with a pinned git tag/commit source; see scripts/flatpak-submission-manifest.mjs.
      - type: dir
        path: ../..
        skip:
          - .git
          - .direnv
          - .flatpak-builder
          - .tmp
          - dist
          - dist-background
          - node_modules
          - src-tauri/gen
          - src-tauri/target
      # END local-source
      - type: file
        url: https://repo.yarnpkg.com/4.16.0/packages/yarnpkg-cli/bin/yarn.js
        sha256: ba05224324578801b9cc98170d64aa50b9a36733b440fb0942306da3fbbdc7d1
        dest-filename: yarn-4.16.0.cjs
      # Generated offline dependency sources (pinned URLs and checksums).
      # Regenerate with the flatpak-builder-tools generators after lockfile changes.
      - generated-sources.json
      - cargo-sources.json
