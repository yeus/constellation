# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
  - test
  - secret-detection
  - deploy
quality:
  image: node:22
  stage: test
  before_script:
    - corepack enable
    - corepack yarn install --immutable
  script:
    - corepack yarn format:check
    - corepack yarn lint
    - corepack yarn test
    - corepack yarn test:android:config
    - corepack yarn build
browser-regression:
  image: mcr.microsoft.com/playwright:v1.61.1-noble
  stage: test
  before_script:
    - corepack enable
    - corepack yarn install --immutable
  script:
    - corepack yarn playwright test tests/share-flow.spec.ts --workers=1
    - corepack yarn playwright test tests/p2p-share.spec.ts --project=desktop --workers=1
sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
pages:
  image: node:22
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - corepack enable
    - corepack yarn install --immutable
  script:
    - VITE_CONSTELLATION_PUBLIC_URL=https://constellation.taskyon.space/ corepack yarn build
    - node scripts/prepare-pages.mjs
  pages:
    publish: dist
  environment:
    name: production
    url: https://constellation.taskyon.space/
